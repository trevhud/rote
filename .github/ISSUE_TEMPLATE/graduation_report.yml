name: Graduation report
description: You ran `rote graduate` on your own skill — tell us how it classified it.
labels: ["graduation-report"]
body:
  - type: markdown
    attributes:
      value: |
        This is the single most useful contribution right now. The
        rubric was designed against one skill (the bundled BDR example);
        every additional skill that passes through it stress-tests the
        classification rubric and the IR schema.
  - type: textarea
    id: skill
    attributes:
      label: Source skill
      description: >
        Paste or attach the `SKILL.md` (redact anything sensitive). A
        one-paragraph description of what the skill does is also fine.
    validations:
      required: true
  - type: textarea
    id: produced
    attributes:
      label: Produced pipeline.yaml
      description: The IR the graduator emitted.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      description: >
        Where the graduator made a call you disagree with — a node
        classified into the wrong kind, a MANDATORY step dropped, a
        deterministic procedure left in the agent loop, etc.
    validations:
      required: true
  - type: input
    id: driver
    attributes:
      label: Driver + model
      placeholder: "claude / Sonnet 4.6"
    validations:
      required: false
