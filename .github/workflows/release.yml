# Release to PyPI via Trusted Publishing (OIDC — no token secrets).
#
# Trigger: pushing a version tag (`git tag v0.2.0 && git push origin v0.2.0`).
# Gates: full fast test suite, ruff, mypy strict, scripts/sanity-check.sh,
# and a tag-matches-package-version check. Build and publish are separate
# jobs per pypa/gh-action-pypi-publish guidance (the publish job must do
# nothing but download the artifact and publish it).
#
# ── One-time PyPI-side setup (before the first tagged release) ──────────
#
# 1. Decide the distribution name. `rote` is TAKEN on PyPI by an unrelated
#    package (checked 2026-07); `rote-cli` was available. If renaming,
#    update `name` in pyproject.toml first. See docs/releasing.md.
# 2. On pypi.org: account sidebar → "Publishing" → GitHub → add a
#    *pending publisher* with:
#      - PyPI project name:  <the name from step 1>
#      - Owner:              trevhud
#      - Repository:         rote
#      - Workflow filename:  release.yml
#      - Environment name:   pypi
#    A pending publisher does NOT reserve the name — it converts to a
#    real publisher on the first successful publish.
# 3. On GitHub: repo Settings → Environments → create `pypi`. Optionally
#    add required reviewers to make publishing a manual approval step.
#
# Attestations (PEP 740) are generated by default — no extra config.

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Test suite + sanity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Tag matches package version
        run: |
          pkg_version="$(python -c 'import rote; print(rote.__version__)')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match rote.__version__ ($pkg_version)" >&2
            exit 1
          fi

      - name: Pytest (fast suite)
        run: pytest tests/

      - name: Ruff lint + format check
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy (strict)
        run: mypy src/rote

      - name: Sanity check (no leaked identifiers/secrets)
        run: ./scripts/sanity-check.sh

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*

      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/rote --version
          /tmp/smoke/bin/rote emit examples/bdr-outreach/expected/pipeline.yaml \
            --runtime temporal --out /tmp/pkg-smoke
          # The compiler skill bundle must resolve from inside the wheel,
          # not from this checkout (regression guard for package data).
          cd /tmp
          /tmp/smoke/bin/python -c "
          from rote.compiler import _default_compiler_skill_dir
          p = _default_compiler_skill_dir()
          assert 'site-packages' in str(p), f'skill bundle missing from wheel: {p}'
          print(f'skill bundle resolved from wheel: {p}')
          "

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      # Required for PyPI Trusted Publishing (OIDC).
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Release pages are indexed individually and feed the repo sidebar;
      # the CHANGELOG alone is invisible to anyone who does not open the
      # file. Notes come from the tag's CHANGELOG section so the two never
      # diverge; a tag without a section fails loudly rather than shipping
      # an empty page.
      - name: Create GitHub release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(awk -v ver="$version" \
            '$0 ~ "^## \\[?"ver {flag=1;next} /^## /{flag=0} flag' CHANGELOG.md)"
          if [ -z "$notes" ]; then
            echo "No CHANGELOG.md section found for $version" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --title "$GITHUB_REF_NAME" --notes "$notes"
