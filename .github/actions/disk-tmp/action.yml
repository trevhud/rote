# ubuntu-26.04 (ubuntu-latest's new target) mounts /tmp as a RAM-backed
# tmpfs with systemd's per-user quota, which caps the runner user at
# about 6.3G. The slow suites write gigabytes of npm trees and dev-server
# state under pytest's tmp dir (8.7G for the TypeScript job before
# tests/_node_trees.py shared the trees), so they failed with EDQUOT.
# This points pytest, npm, and wrangler at the root disk instead. The
# directory must stay outside $HOME, because the sandbox tests assert
# that nothing under the home is exposed.
name: Disk-backed TMPDIR
description: Keep temp files on the root disk, off the quota-limited /tmp tmpfs.
runs:
  using: composite
  steps:
    - name: Keep temp files on disk, off the quota-limited /tmp
      shell: bash
      run: |
        dir=/var/tmp/rote-ci
        mkdir -p "$dir"
        fstype=$(findmnt -no FSTYPE --target "$dir")
        if [ "$fstype" = tmpfs ]; then
          echo "::error::$dir is on tmpfs, so it would hit the same quota"
          exit 1
        fi
        echo "TMPDIR=$dir" >> "$GITHUB_ENV"
