notes: >-
  This is a sequential, data-pull-plus-report skill with no per-item loops
  and no fuzzy classification. The agent cost is dominated by (a) the four
  MCP data-pull turns, which an agent sometimes batches into fewer turns
  via parallel tool calls, and (b) the report-assembly turns where the agent
  must write all three sections from scratch each run. The HITL wait (duty
  manager response) is wall-clock time, not agent turns.

  In the graduated pipeline, the 8 deterministic nodes (4 external_call +
  8 pure_function = 12 total, excluding the 1 hitl_gate) require exactly
  zero LLM tokens at runtime. The only LLM-adjacent cost is the HITL
  notification message. Expected per-run cost reduction: ~95% of agent turns
  eliminated.
