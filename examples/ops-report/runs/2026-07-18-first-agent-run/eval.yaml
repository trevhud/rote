# Estimates for running the ops-report skill as raw agent instructions.
# This is the BEFORE side of the rote eval scorecard — what the agent spends
# when following the SKILL.md prose directly.
#
# Shape: sequential tool-heavy skill, one HITL pause, no per-item loops.
# Expected range based on calibration anchors: 10–22 turns total.
# The data pulls dominate (4 separate tool calls, often in parallel but
# the agent may not always batch them), and report assembly requires the
# agent to generate all three sections from scratch.

