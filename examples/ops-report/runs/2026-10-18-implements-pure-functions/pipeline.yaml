name: ops-report
version: "0.1.0"
source_skill: ../../skill
description: |
  Daily executive operations report for a parcel fulfillment network.
  Auto-pulls four data sources from Google Drive and Gmail in parallel,
  pauses at a HITL gate to collect three manual KPI inputs from the duty
  manager, applies deterministic threshold classifiers, then renders a
  three-section Markdown report with a KPI header and color-coded dwell
  alerts.

config:
  schedule: "0 6 * * *"        # Daily at 06:00 — adjust to local ops timezone
  on_failure: notify_owner
  observability:
    traces: true
    eval_set_dir: ./evals/
  hitl:
    default_timeout: 4h         # Duty manager expected to respond within shift

input:
  type: OpsReportInput
  required: []
  optional:
    - report_date
  input_schema:
    type: object
    title: OpsReportInput
    properties:
      report_date:
        type: string
        description: "ISO 8601 date (YYYY-MM-DD). Defaults to today when omitted."
    required: []
    additionalProperties: false

# ─────────────────────────────────────────────────────────────────────────────
# NODES
# ─────────────────────────────────────────────────────────────────────────────
nodes:

  # ── Wave 1: parallel data pulls (Pattern 8 — all four are independent) ───

  - id: fetch_shipment_containers
    kind: external_call
    phase: "Data sources"
    source:
      section: "Data sources to auto-pull"
    description: >
      Fetch the shipment containers spreadsheet from Google Drive.
      Returns raw file content (CSV/TSV) for parse_shipment_containers.
    impl: extracted/fetch.py:fetch_drive_file
    inputs: {}
    output: raw_content str
    constants:
      file_id: "1ExampleShipmentContainersFileId00000000000"
    mcp:
      server: google_drive
      tool: read_file_content
      args:
        file_id: file_id
    timeout: 30s
    retry:
      max: 3
      backoff: exponential
      retry_on: [rate_limit, network]
    mandatory: true

  - id: fetch_dock_pending_log
    kind: external_call
    phase: "Data sources"
    source:
      section: "Data sources to auto-pull"
    description: >
      Fetch the dock pending log spreadsheet from Google Drive.
      Returns raw file content (CSV/TSV) for parse_dock_pending_log.
    impl: extracted/fetch.py:fetch_drive_file
    inputs: {}
    output: raw_content str
    constants:
      file_id: "1ExampleDockPendingLogFileId0000000000000000"
    mcp:
      server: google_drive
      tool: read_file_content
      args:
        file_id: file_id
    timeout: 30s
    retry:
      max: 3
      backoff: exponential
      retry_on: [rate_limit, network]
    mandatory: true

  - id: fetch_dock_activity_emails
    kind: external_call
    phase: "Data sources"
    source:
      section: "Data sources to auto-pull"
    description: >
      Search Gmail for dock-activity threads from the last 24 hours.
      Returns raw search result dict for parse_dock_activity_emails.
    impl: extracted/fetch.py:fetch_gmail_threads
    inputs: {}
    output: raw_threads dict
    constants:
      search_query: "label:dock-activity newer_than:1d"
    mcp:
      server: gmail
      tool: search_threads
      args:
        query: search_query
    timeout: 30s
    retry:
      max: 3
      backoff: exponential
      retry_on: [rate_limit, network]
    mandatory: true

  - id: fetch_dwell_tickets
    kind: external_call
    phase: "Data sources"
    source:
      section: "Data sources to auto-pull"
    description: >
      Fetch the dwell ticket log spreadsheet from Google Drive,
      tab "Dwell Log - Form Responses". Returns raw CSV for parse_dwell_tickets.
    impl: extracted/fetch.py:fetch_drive_file
    inputs: {}
    output: raw_content str
    constants:
      file_id: "1ExampleDwellTicketLogFileId0000000000000000"
      tab: "Dwell Log - Form Responses"
    mcp:
      server: google_drive
      tool: read_file_content
      # open question: read_file_content may not support a sheet_name arg —
      # see compile-report.md. The tab constant is surfaced here so the
      # operator can verify and adjust the mcp.args mapping.
      args:
        file_id: file_id
    timeout: 30s
    retry:
      max: 3
      backoff: exponential
      retry_on: [rate_limit, network]
    mandatory: true

  # ── Wave 2: parse each raw pull (pure, deterministic) ────────────────────

  - id: parse_shipment_containers
    kind: pure_function
    phase: "Data sources"
    source:
      section: "1. Shipment Containers (Google Drive MCP — read_file_content)"
    description: >
      Parse facility summary table; report active/loaded/staged/shipped
      counts and completion % by site; flag sites below 75% completion;
      surface week-over-week trend when the PREV COMPLETION % column exists.
    impl: extracted/parsers.py:parse_shipment_containers
    inputs:
      raw: fetch_shipment_containers.output
    output:
      sites: list
      avg_completion_pct: float
      active_site_count: int
      flagged_sites: list
    constants:
      completion_threshold: 75.0
    mandatory: true

  - id: parse_dock_pending_log
    kind: pure_function
    phase: "Data sources"
    source:
      section: "2. Dock Pending Log (Google Drive MCP — read_file_content)"
    description: >
      Count all rows where Resolved = FALSE; break down by site and issue type.
    impl: extracted/parsers.py:parse_dock_pending_log
    inputs:
      raw: fetch_dock_pending_log.output
    output:
      total_open: int
      by_site: dict
      by_issue_type: dict
    mandatory: true

  - id: parse_dock_activity_emails
    kind: pure_function
    phase: "Data sources"
    source:
      section: "3. Dock Activity Emails (Gmail MCP — search_threads)"
    description: >
      Count Approved vs. Requested dock appointments from Gmail threads;
      collect unapproved request subjects for flagging.
    impl: extracted/parsers.py:parse_dock_activity_emails
    inputs:
      raw: fetch_dock_activity_emails.output
    output:
      approved_count: int
      requested_count: int
      unapproved_requests: list
      total_threads: int
    mandatory: true

  - id: parse_dwell_tickets
    kind: pure_function
    phase: "Data sources"
    source:
      section: "4. Open Dwell Tickets (Google Drive MCP — read_file_content)"
    description: >
      Filter open tickets; apply Missort Warning (>=25), Missort Alert (>=41),
      and Possible Misload Alert (>=80) thresholds per ticket row.
    impl: extracted/parsers.py:parse_dwell_tickets
    inputs:
      raw: fetch_dwell_tickets.output
    output:
      open_tickets: list
      total_open: int
    constants:
      packages_warning_threshold: 25
      packages_alert_threshold: 41
      carrier_alert_threshold: 80
    mandatory: true

  # ── Wave 3: HITL gate — collect manual KPIs from duty manager ────────────

  - id: request_manual_data_gate
    kind: hitl_gate
    phase: "Manual data"
    source:
      section: "Manual data to request from user"
    description: >
      Pause workflow and ask the duty manager to supply three manual data sets:
      (1) dock appointment completion color counts from the scheduler's view,
      (2) sorter metrics (volume + fail rate) per site,
      (3) current dwell data from the BI dashboard filtered by site.
    input:
      shipment_summary: dict
      dock_pending_summary: dict
      dock_email_summary: dict
      dwell_ticket_summary: dict
    output:
      appointment_completion: dict
      sorter_metrics: list
      dwell_data: list
    signal: manual_data_provided
    timeout: 4h
    notify:
      channel: slack
      target: "#ops-duty-managers"
      message_template: >
        Daily ops report is ready for your manual inputs.
        Please provide: dock appointment completion counts,
        sorter metrics, and current BI dashboard dwell data.
        Signal: manual_data_provided

  # ── Wave 4: apply threshold classifiers to manual data ───────────────────

  - id: apply_appointment_flags
    kind: pure_function
    phase: "Manual data"
    source:
      section: "Manual data to request from user"
    description: >
      Apply Non-Compliant escalation flag to duty-manager-supplied
      dock appointment color counts. Any "other" count triggers escalation.
    impl: extracted/thresholds.py:apply_appointment_flags
    inputs:
      appointment_completion: request_manual_data_gate.output.appointment_completion
    output:
      green: int
      red: int
      grey: int
      other: int
      non_compliant_count: int
      escalation_required: bool
    mandatory: true

  - id: apply_sorter_flags
    kind: pure_function
    phase: "Manual data"
    source:
      section: "Manual data to request from user"
    description: >
      Apply action flags to sorter metrics: ACTION NEEDED if fail_rate > 5%,
      DIVERT ADJUSTMENT MAY BE NEEDED if volume dropped >15% day-over-day.
    impl: extracted/thresholds.py:apply_sorter_flags
    inputs:
      sorter_metrics: request_manual_data_gate.output.sorter_metrics
    output:
      sites: list
      action_required_sites: list
      divert_adjustment_sites: list
    constants:
      fail_rate_threshold: 5.0
      volume_drop_threshold: 15.0
    mandatory: true

  - id: apply_dwell_thresholds
    kind: pure_function
    phase: "Manual data"
    source:
      section: "Manual data to request from user"
    description: >
      Apply color-coded dwell alert thresholds to BI dashboard data:
      Brand 25-40 = Missort Warning, 41+ = Missort Alert,
      Carrier 80+ = Possible Misload Alert.
    impl: extracted/thresholds.py:apply_dwell_thresholds
    inputs:
      dwell_data: request_manual_data_gate.output.dwell_data
    output:
      all_rows: list
      flagged_rows: list
    constants:
      brand_warning_threshold: 25
      brand_alert_threshold: 41
      carrier_alert_threshold: 80
    mandatory: true

  # ── Wave 5: render final report ───────────────────────────────────────────

  - id: render_report
    kind: pure_function
    phase: "Report format"
    source:
      section: "Report format"
    description: >
      Assemble the full executive operations report as Markdown.
      KPI header + Section 1 (Dock Compliance) + Section 2 (Missort & Loss)
      + Section 3 (Dwell) + artifact reminder.
    impl: extracted/render.py:render_report
    inputs:
      shipment_data: parse_shipment_containers.output
      dock_pending_data: parse_dock_pending_log.output
      dock_email_data: parse_dock_activity_emails.output
      dwell_tickets_data: parse_dwell_tickets.output
      appointment_data: apply_appointment_flags.output
      sorter_data: apply_sorter_flags.output
      dwell_data: apply_dwell_thresholds.output
    output: report_markdown str
    mandatory: true

# ─────────────────────────────────────────────────────────────────────────────
# EDGES
# ─────────────────────────────────────────────────────────────────────────────
edges:
  # Wave 1 → Wave 2 (fetch → parse, four parallel chains)
  - {from: fetch_shipment_containers,   to: parse_shipment_containers}
  - {from: fetch_dock_pending_log,      to: parse_dock_pending_log}
  - {from: fetch_dock_activity_emails,  to: parse_dock_activity_emails}
  - {from: fetch_dwell_tickets,         to: parse_dwell_tickets}

  # Wave 2 → Wave 3 (all four parses feed the HITL gate)
  - {from: parse_shipment_containers,   to: request_manual_data_gate}
  - {from: parse_dock_pending_log,      to: request_manual_data_gate}
  - {from: parse_dock_activity_emails,  to: request_manual_data_gate}
  - {from: parse_dwell_tickets,         to: request_manual_data_gate}

  # Wave 3 → Wave 4 (gate fires three threshold nodes in parallel)
  - {from: request_manual_data_gate, to: apply_appointment_flags, on_signal: manual_data_provided}
  - {from: request_manual_data_gate, to: apply_sorter_flags,      on_signal: manual_data_provided}
  - {from: request_manual_data_gate, to: apply_dwell_thresholds,  on_signal: manual_data_provided}

  # Wave 2+4 → Wave 5 (render collects from all seven upstreams)
  - {from: parse_shipment_containers,  to: render_report}
  - {from: parse_dock_pending_log,     to: render_report}
  - {from: parse_dock_activity_emails, to: render_report}
  - {from: parse_dwell_tickets,        to: render_report}
  - {from: apply_appointment_flags,    to: render_report}
  - {from: apply_sorter_flags,         to: render_report}
  - {from: apply_dwell_thresholds,     to: render_report}

entry_nodes:
  # Pattern 8: all four data pulls are independent — run concurrently
  - fetch_shipment_containers
  - fetch_dock_pending_log
  - fetch_dock_activity_emails
  - fetch_dwell_tickets

exit_nodes:
  - render_report

