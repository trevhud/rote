name: ops-report
version: "0.1.0"
source_skill: ../../skill
description: |
  Daily executive operations report for a parcel fulfillment network.
  Auto-pulls shipment containers, dock pending log, dwell tickets from
  Google Drive and dock-activity emails from Gmail, then suspends for
  the duty manager to supply appointment completion, sorter metrics, and
  current BI-dashboard dwell data, before assembling the three-section
  executive summary with KPI header and color-coded dwell alerts.

config:
  # rote: assumption: 6 AM daily schedule; the skill says "daily" but does not pin an hour.
  schedule: "0 6 * * *"
  on_failure: notify_owner
  observability:
    traces: true
  hitl:
    default_timeout: 4h

input:
  type: OpsReportInput
  required: []
  optional:
    - report_date
  input_schema:
    type: object
    title: OpsReportInput
    properties:
      report_date:
        type: string
        description: "ISO date YYYY-MM-DD to run for. Omit to default to today."
    additionalProperties: false

nodes:

  # ── Wave 1: parallel data pulls ────────────────────────────────────────────

  - id: fetch_shipment_containers
    kind: external_call
    phase: "Data sources"
    source:
      section: "Data sources to auto-pull"
    description: |
      Fetch the Shipment Containers spreadsheet from Google Drive
      (File ID: 1ExampleShipmentContainersFileId00000000000).
    impl: extracted/drive.py:fetch_drive_file
    mcp:
      server: google_drive
      tool: read_file_content
      # rote: assumption: the read_file_content MCP tool accepts a 'file_id'
      # parameter (snake_case). Verify against the google_drive MCP server
      # docs if the tool uses 'fileId' (camelCase) instead.
      args:
        file_id: file_id
    output:
      content: str
    constants:
      file_id: "1ExampleShipmentContainersFileId00000000000"
    timeout: 30s
    retry:
      max: 3
      backoff: exponential
      retry_on: [rate_limit, network]
    mandatory: true

  - id: fetch_dock_pending_log
    kind: external_call
    phase: "Data sources"
    source:
      section: "Data sources to auto-pull"
    description: |
      Fetch the Dock Pending Log spreadsheet from Google Drive
      (File ID: 1ExampleDockPendingLogFileId0000000000000000).
    impl: extracted/drive.py:fetch_drive_file
    mcp:
      server: google_drive
      tool: read_file_content
      args:
        file_id: file_id
    output:
      content: str
    constants:
      file_id: "1ExampleDockPendingLogFileId0000000000000000"
    timeout: 30s
    retry:
      max: 3
      backoff: exponential
      retry_on: [rate_limit, network]
    mandatory: true

  - id: fetch_dock_activity_emails
    kind: external_call
    phase: "Data sources"
    source:
      section: "Data sources to auto-pull"
    description: |
      Search Gmail for dock-activity threads from the last day
      (query: label:dock-activity newer_than:1d).
    impl: extracted/gmail.py:search_gmail_threads
    mcp:
      server: gmail
      tool: search_threads
      args:
        query: query
    output:
      threads: list
      resultSizeEstimate: int
    constants:
      query: "label:dock-activity newer_than:1d"
    timeout: 30s
    retry:
      max: 3
      backoff: exponential
      retry_on: [rate_limit, network]
    mandatory: true

  - id: fetch_dwell_tickets
    kind: external_call
    phase: "Data sources"
    source:
      section: "Data sources to auto-pull"
    description: |
      Fetch the Dwell Ticket Log spreadsheet from Google Drive,
      tab 'Dwell Log - Form Responses'
      (File ID: 1ExampleDwellTicketLogFileId0000000000000000).
    impl: extracted/drive.py:fetch_drive_file
    mcp:
      server: google_drive
      tool: read_file_content
      args:
        file_id: file_id
    output:
      content: str
    constants:
      file_id: "1ExampleDwellTicketLogFileId0000000000000000"
    timeout: 30s
    retry:
      max: 3
      backoff: exponential
      retry_on: [rate_limit, network]
    mandatory: true

  # ── Wave 2: parse raw results (parallel) ───────────────────────────────────

  - id: parse_shipment_containers
    kind: pure_function
    phase: "Data sources"
    source:
      section: "Data sources to auto-pull"
    description: |
      Parse the facility summary table: active/loaded/staged/shipped counts
      and completion % by site. Flag sites below 75% completion.
      Show week-over-week trend when a prior-week column is present.
    impl: extracted/parse_shipment_containers.py:parse_shipment_containers
    input:
      raw_content: str
    inputs:
      raw_content: fetch_shipment_containers.output.content
    output:
      sites: list
      flagged_sites: list
      total_active: int
      avg_completion_pct: float
    constants:
      completion_threshold: 75.0
    mandatory: true

  - id: parse_dock_pending_log
    kind: pure_function
    phase: "Data sources"
    source:
      section: "Data sources to auto-pull"
    description: |
      Count rows where Resolved = FALSE. Break down by site (EAST1, WEST2,
      etc.) and issue type (PO Number, Pallet/Piece Count Discrepancy).
    impl: extracted/parse_dock_pending_log.py:parse_dock_pending_log
    input:
      raw_content: str
    inputs:
      raw_content: fetch_dock_pending_log.output.content
    output:
      total_open: int
      by_site: dict
      by_issue_type: dict
    mandatory: true

  - id: parse_dock_activity_emails
    kind: pure_function
    phase: "Data sources"
    source:
      section: "Data sources to auto-pull"
    description: |
      Count Approved vs. Requested appointments in dock-activity Gmail threads.
      Flag outstanding requests not yet approved.
    impl: extracted/parse_dock_activity_emails.py:parse_dock_activity_emails
    input:
      threads_result: dict
    inputs:
      threads_result: fetch_dock_activity_emails.output
    output:
      approved_count: int
      requested_count: int
      outstanding_requests: list
      total_threads: int
    mandatory: true

  - id: parse_dwell_tickets
    kind: pure_function
    phase: "Data sources"
    source:
      section: "Data sources to auto-pull"
    description: |
      Filter Dwell Log rows where Open/Closed = 'Open'. Apply thresholds:
      brand packages >= 25 (Missort Warning), >= 41 (Missort Alert);
      carrier packages >= 80 (Possible Misload Alert).
    impl: extracted/parse_dwell_tickets.py:parse_dwell_tickets
    input:
      raw_content: str
    inputs:
      raw_content: fetch_dwell_tickets.output.content
    output:
      open_tickets: list
      total_open: int
      alerts: dict
    constants:
      brand_warning_threshold: 25
      brand_alert_threshold: 41
      carrier_alert_threshold: 80
    mandatory: true

  # ── Wave 3: HITL gate ────────────────────────────────────────────────────

  - id: duty_manager_data_gate
    kind: hitl_gate
    phase: "Manual data"
    source:
      section: "Manual data to request from user"
    description: |
      Pause and present auto-pulled data context to the duty manager.
      Wait for the duty manager to supply:
        1. Dock Appointment Completion counts (Green/Red/Grey/Non-Compliant).
        2. Sorter Metrics per site (volume output, fail rate %).
        3. Current Dwell snapshot from the BI dashboard.
    input:
      shipment_data: dict
      dock_pending_data: dict
      email_data: dict
      dwell_data: dict
    inputs:
      shipment_data: parse_shipment_containers.output
      dock_pending_data: parse_dock_pending_log.output
      email_data: parse_dock_activity_emails.output
      dwell_data: parse_dwell_tickets.output
    output:
      dock_appointments: dict
      sorter_metrics: list
      current_dwell: list
    signal: duty_manager_data_provided
    timeout: 4h
    notify:
      channel: email
      target: duty_manager
      message_template: |
        Daily ops report is ready for your input. Please provide dock
        appointment completion, sorter metrics, and current dwell data.

  # ── Wave 4: validate manual data ──────────────────────────────────────────

  - id: validate_manual_data
    kind: pure_function
    phase: "Manual data"
    source:
      section: "Manual data to request from user"
    description: |
      Validate and structure the duty manager's signal payload.
      Apply escalation flag for Non-Compliant appointments.
      Apply sorter flags: fail rate > 5%, volume drop > 15% DoD.
      Apply dwell alert thresholds matching the BI dashboard section.
    impl: extracted/validate_manual_data.py:validate_manual_data
    input:
      duty_manager_input: dict
    inputs:
      duty_manager_input: duty_manager_data_gate.output
    output:
      dock_appointments: dict
      sorter_metrics: list
      current_dwell: list
    constants:
      sorter_fail_rate_threshold: 5.0
      sorter_volume_drop_threshold: 15.0
      brand_warning_threshold: 25
      brand_alert_threshold: 41
      carrier_alert_threshold: 80
    mandatory: true

  # ── Wave 5: render final report ───────────────────────────────────────────

  - id: render_ops_report
    kind: pure_function
    phase: "Report format"
    source:
      section: "Report format"
    description: |
      Assemble the executive operations report Markdown string:
      KPI header + Section 1 (Dock Compliance) + Section 2 (Missort & Loss)
      + Section 3 (Dwell) + reminder to open the live ops-report artifact.
    impl: extracted/render_ops_report.py:render_ops_report
    input:
      shipment_data: dict
      dock_pending_data: dict
      email_data: dict
      dwell_data: dict
      manual_data: dict
    inputs:
      shipment_data: parse_shipment_containers.output
      dock_pending_data: parse_dock_pending_log.output
      email_data: parse_dock_activity_emails.output
      dwell_data: parse_dwell_tickets.output
      manual_data: validate_manual_data.output
    output:
      report_markdown: str
    mandatory: true

edges:
  - {from: fetch_shipment_containers,   to: parse_shipment_containers}
  - {from: fetch_dock_pending_log,      to: parse_dock_pending_log}
  - {from: fetch_dock_activity_emails,  to: parse_dock_activity_emails}
  - {from: fetch_dwell_tickets,         to: parse_dwell_tickets}
  - {from: parse_shipment_containers,   to: duty_manager_data_gate}
  - {from: parse_dock_pending_log,      to: duty_manager_data_gate}
  - {from: parse_dock_activity_emails,  to: duty_manager_data_gate}
  - {from: parse_dwell_tickets,         to: duty_manager_data_gate}
  - {from: duty_manager_data_gate,      to: validate_manual_data, on_signal: duty_manager_data_provided}
  - {from: validate_manual_data,        to: render_ops_report}
  - {from: parse_shipment_containers,   to: render_ops_report}
  - {from: parse_dock_pending_log,      to: render_ops_report}
  - {from: parse_dock_activity_emails,  to: render_ops_report}
  - {from: parse_dwell_tickets,         to: render_ops_report}

entry_nodes:
  - fetch_shipment_containers
  - fetch_dock_pending_log
  - fetch_dock_activity_emails
  - fetch_dwell_tickets

exit_nodes:
  - render_ops_report
