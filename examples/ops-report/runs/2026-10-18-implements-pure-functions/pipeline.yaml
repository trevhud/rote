name: ops-report
version: "0.1.0"
source_skill: ../../skill
description: |
  Scheduled daily executive operations report for a parcel fulfillment network.
  Pulls four data sources in parallel (three Google Drive spreadsheets + Gmail),
  pauses for a HITL gate so the duty manager can supply dashboard-locked metrics,
  applies all numeric thresholds deterministically, and renders a three-section
  executive summary with a KPI header and color-coded dwell alerts.

config:
  schedule: "0 6 * * *"
  on_failure: notify_owner
  observability:
    traces: true
    eval_set_dir: ./evals/
  hitl:
    default_timeout: 4h

input:
  type: OpsReportRun
  required: []
  optional:
    - run_date
  input_schema:
    type: object
    title: OpsReportRun
    properties:
      run_date:
        type: string
        format: date
        description: "ISO date for the report run; defaults to today when omitted"
    additionalProperties: false

# ── nodes ─────────────────────────────────────────────────────────────────────

nodes:

  # ── parallel data pulls (entry wave) ───────────────────────────────────────

  - id: fetch_shipment_containers
    kind: external_call
    phase: "Data sources"
    source:
      section: "Data sources to auto-pull"
    description: |
      Fetch the Shipment Containers spreadsheet from Google Drive.
      File ID: 1ExampleShipmentContainersFileId00000000000
    impl: extracted/google_drive.py:fetch_shipment_containers
    mcp:
      server: google_drive
      tool: read_file_content
    output:
      raw_content: str
    constants:
      file_id: "1ExampleShipmentContainersFileId00000000000"
    mandatory: true
    retry:
      max: 3
      backoff: exponential
      retry_on: [rate_limit, network]
    timeout: 30s

  - id: fetch_dock_pending_log
    kind: external_call
    phase: "Data sources"
    source:
      section: "Data sources to auto-pull"
    description: |
      Fetch the Dock Pending Log spreadsheet from Google Drive.
      File ID: 1ExampleDockPendingLogFileId0000000000000000
    impl: extracted/google_drive.py:fetch_dock_pending_log
    mcp:
      server: google_drive
      tool: read_file_content
    output:
      raw_content: str
    constants:
      file_id: "1ExampleDockPendingLogFileId0000000000000000"
    mandatory: true
    retry:
      max: 3
      backoff: exponential
      retry_on: [rate_limit, network]
    timeout: 30s

  - id: fetch_dock_emails
    kind: external_call
    phase: "Data sources"
    source:
      section: "Data sources to auto-pull"
    description: |
      Search Gmail for dock-activity threads from the last 24 hours.
      Query: label:dock-activity newer_than:1d
    impl: extracted/gmail.py:fetch_dock_emails
    mcp:
      server: gmail
      tool: search_threads
    output:
      threads: list
    constants:
      query: "label:dock-activity newer_than:1d"
    mandatory: true
    retry:
      max: 3
      backoff: exponential
      retry_on: [rate_limit, network]
    timeout: 30s

  - id: fetch_dwell_tickets
    kind: external_call
    phase: "Data sources"
    source:
      section: "Data sources to auto-pull"
    description: |
      Fetch the Dwell Ticket Log spreadsheet from Google Drive.
      File ID: 1ExampleDwellTicketLogFileId0000000000000000
      Tab: Dwell Log - Form Responses
    impl: extracted/google_drive.py:fetch_dwell_tickets
    mcp:
      server: google_drive
      tool: read_file_content
    output:
      raw_content: str
    constants:
      file_id: "1ExampleDwellTicketLogFileId0000000000000000"
      tab: "Dwell Log - Form Responses"
    mandatory: true
    retry:
      max: 3
      backoff: exponential
      retry_on: [rate_limit, network]
    timeout: 30s

  # ── parse wave ──────────────────────────────────────────────────────────────

  - id: parse_shipment_containers
    kind: pure_function
    phase: "Data sources"
    source:
      section: "Data sources to auto-pull"
    description: |
      Parse the facility summary table. Report active/loaded/staged/shipped
      counts and completion % by site. Flag any site below 75% completion.
      Show week-over-week trend when the column is present.
    impl: extracted/parsers.py:parse_shipment_containers
    inputs:
      raw_content: fetch_shipment_containers.output.raw_content
    output:
      sites: list
      flagged_sites: list
      avg_completion_pct: float
      total_active: int
      active_site_count: int
    constants:
      completion_threshold_pct: 75
    mandatory: true
    timeout: 10s

  - id: parse_dock_pending_log
    kind: pure_function
    phase: "Data sources"
    source:
      section: "Data sources to auto-pull"
    description: |
      Count all rows where Resolved = FALSE. Break down by site
      (EAST1, WEST2, etc.) and issue type (PO Number, Pallet/Piece
      Count Discrepancy). Report total open count.
    impl: extracted/parsers.py:parse_dock_pending_log
    inputs:
      raw_content: fetch_dock_pending_log.output.raw_content
    output:
      total_open: int
      by_site: dict
      by_issue_type: dict
    mandatory: true
    timeout: 10s

  - id: classify_dock_email
    kind: llm_judge
    phase: "Data sources"
    source:
      section: "Data sources to auto-pull"
    description: |
      Classify a single Gmail dock-activity thread as an appointment
      approval, request, or unrelated. Fan-out: one invocation per thread.
    signature: signatures/classify_dock_email.py:ClassifyDockEmail
    signature_spec:
      input_schema:
        type: object
        properties:
          thread:
            type: object
            description: "A single Gmail thread object returned by search_threads"
        required:
          - thread
        additionalProperties: false
      output_schema:
        type: object
        properties:
          classification:
            enum:
              - appointment_approved
              - appointment_requested
              - other
          appointment_ref:
            anyOf:
              - type: string
              - type: "null"
            default: null
          thread_id:
            type: string
        required:
          - classification
          - thread_id
        additionalProperties: false
      prompt: |
        You are classifying a dock-activity email thread for an ops report.

        Classify this thread as one of:
        - appointment_approved: The thread confirms/approves a dock appointment
          (look for "approved", "confirmed", "confirmation" language).
        - appointment_requested: The thread requests or is pending a dock
          appointment (look for "request", "requesting", "pending", "submitted").
        - other: Unrelated to appointment approval or requesting.

        Also extract an appointment_ref — the appointment ID, confirmation
        number, or subject line — so approvals can be matched to requests.
        Return null if classification is "other".

        Thread: {{ thread }}

        Return your decision via the structured output tool.
      client: anthropic
      model: claude-sonnet-4-6
    inputs:
      thread: fetch_dock_emails.output.threads
    output:
      classification: str
      appointment_ref: str
      thread_id: str
    fan_out: true
    eval_set: evals/classify_dock_email.jsonl
    mandatory: true
    timeout: 30s

  - id: aggregate_dock_emails
    kind: pure_function
    phase: "Data sources"
    source:
      section: "Data sources to auto-pull"
    description: |
      Aggregate per-thread classifications into approval and request counts.
      Surface outstanding requests (requested but not yet approved).
    impl: extracted/email_aggregator.py:aggregate_dock_emails
    inputs:
      classified_threads: classify_dock_email.output
    output:
      approved_count: int
      requested_count: int
      outstanding_requests: list
    mandatory: true
    timeout: 10s

  - id: parse_dwell_tickets
    kind: pure_function
    phase: "Data sources"
    source:
      section: "Data sources to auto-pull"
    description: |
      Filter rows where Open/Closed = Open. Apply dwell thresholds:
      packages >= 25 (Missort Warning), >= 41 (Missort Alert),
      carrier_packages >= 80 (Possible Misload Alert).
    impl: extracted/parsers.py:parse_dwell_tickets
    inputs:
      raw_content: fetch_dwell_tickets.output.raw_content
    output:
      open_tickets: list
      missort_warnings: list
      missort_alerts: list
      misload_alerts: list
      total_open: int
    constants:
      missort_warning_threshold: 25
      missort_alert_threshold: 41
      misload_alert_threshold: 80
    mandatory: true
    timeout: 10s

  # ── HITL gate ───────────────────────────────────────────────────────────────

  - id: duty_manager_data_gate
    kind: hitl_gate
    phase: "Manual data"
    source:
      section: "Manual data to request from user"
    description: |
      Pause and request three data items from the duty manager that live
      behind interactive dashboards and cannot be auto-pulled:
      1. Dock Appointment Completion (color counts from scheduler view)
      2. Sorter Metrics (volume output + fail rate % per site)
      3. Current Dwell (from BI dashboard filtered by site)
    output:
      dock_appointment_completion: object
      sorter_metrics: list
      current_dwell: list
    signal: duty_manager_data_provided
    timeout: 4h
    notify:
      channel: slack
      target: "#ops-duty"
      message_template: |
        Daily ops report is ready for manual inputs. Please provide:
        1. Dock Appointment Completion (Green/Red/Grey/Other counts) for yesterday
        2. Sorter Metrics (volume + fail rate %) for all active sites
        3. Current Dwell from the BI dashboard (filtered by site)
        Signal: duty_manager_data_provided

  # ── threshold enforcement ───────────────────────────────────────────────────

  - id: apply_manual_thresholds
    kind: pure_function
    phase: "Manual data"
    source:
      section: "Manual data to request from user"
    description: |
      Apply all skill-defined thresholds to duty-manager-supplied data:
      - Dock Non-Compliant (other color) → escalate flag
      - Sorter fail rate > 5% → action needed flag
      - Sorter volume drop > 15% day-over-day → divert adjustment flag
      - Dwell brand 25-40 → Missort Warning
      - Dwell brand 41+  → Missort Alert
      - Dwell carrier 80+ → Possible Misload Alert
    impl: extracted/thresholds.py:apply_manual_thresholds
    inputs:
      dock_appointment_completion: duty_manager_data_gate.output.dock_appointment_completion
      sorter_metrics: duty_manager_data_gate.output.sorter_metrics
      current_dwell: duty_manager_data_gate.output.current_dwell
    output:
      appointment_summary: object
      sorter_sites: list
      flagged_sorter_sites: list
      dwell_alerts: list
      dwell_warning_entries: list
      dwell_alert_entries: list
      misload_alert_entries: list
      non_compliant_appointments: int
    constants:
      sorter_fail_rate_threshold_pct: 5
      sorter_volume_drop_threshold_pct: 15
      dwell_warning_packages: 25
      dwell_alert_packages: 41
      dwell_misload_carrier: 80
    mandatory: true
    timeout: 10s

  # ── report renderer ─────────────────────────────────────────────────────────

  - id: render_ops_report
    kind: pure_function
    phase: "Report format"
    source:
      section: "Report format"
    description: |
      Assemble the final executive operations report as Markdown.
      KPI header + Section 1 (Dock Compliance) + Section 2 (Missort & Loss)
      + Section 3 (Dwell) + reminder to open the live ops-report artifact.
    impl: extracted/report.py:render_ops_report
    inputs:
      shipment_data: parse_shipment_containers.output
      dock_pending_data: parse_dock_pending_log.output
      email_data: aggregate_dock_emails.output
      dwell_tickets: parse_dwell_tickets.output
      manual_thresholds: apply_manual_thresholds.output
    output:
      report_markdown: str
    mandatory: true
    timeout: 30s

# ── edges ─────────────────────────────────────────────────────────────────────

edges:
  - {from: fetch_shipment_containers,  to: parse_shipment_containers}
  - {from: fetch_dock_pending_log,     to: parse_dock_pending_log}
  - {from: fetch_dock_emails,          to: classify_dock_email,      fan_out: true}
  - {from: classify_dock_email,        to: aggregate_dock_emails}
  - {from: fetch_dwell_tickets,        to: parse_dwell_tickets}
  - {from: parse_shipment_containers,  to: duty_manager_data_gate}
  - {from: parse_dock_pending_log,     to: duty_manager_data_gate}
  - {from: aggregate_dock_emails,      to: duty_manager_data_gate}
  - {from: parse_dwell_tickets,        to: duty_manager_data_gate}
  - {from: duty_manager_data_gate,     to: apply_manual_thresholds,  on_signal: duty_manager_data_provided}
  - {from: apply_manual_thresholds,    to: render_ops_report}
  - {from: parse_shipment_containers,  to: render_ops_report}
  - {from: parse_dock_pending_log,     to: render_ops_report}
  - {from: aggregate_dock_emails,      to: render_ops_report}
  - {from: parse_dwell_tickets,        to: render_ops_report}

entry_nodes:
  - fetch_shipment_containers
  - fetch_dock_pending_log
  - fetch_dock_emails
  - fetch_dwell_tickets

exit_nodes:
  - render_ops_report
