version: 1
source_skill: ../../skill

steps:
  - description: "Fetch shipment containers file from Google Drive (read_file_content)"
    node_id: fetch_shipment_containers
    phase: "Data sources"
    estimated_turns: {low: 1, high: 2}
    estimated_tool_calls: {low: 1, high: 1}

  - description: "Fetch dock pending log from Google Drive (read_file_content)"
    node_id: fetch_dock_pending_log
    phase: "Data sources"
    estimated_turns: {low: 1, high: 2}
    estimated_tool_calls: {low: 1, high: 1}

  - description: "Search Gmail dock-activity threads (search_threads, newer_than:1d)"
    node_id: fetch_dock_activity_emails
    phase: "Data sources"
    estimated_turns: {low: 1, high: 2}
    estimated_tool_calls: {low: 1, high: 1}

  - description: "Fetch dwell ticket log from Google Drive, tab Dwell Log - Form Responses"
    node_id: fetch_dwell_tickets
    phase: "Data sources"
    estimated_turns: {low: 1, high: 2}
    estimated_tool_calls: {low: 1, high: 1}

  - description: "Parse and annotate all four data pulls (count rows, apply flags, identify sites)"
    phase: "Data sources"
    estimated_turns: {low: 2, high: 4}

  - description: "Ask duty manager for dock appointment completion counts (Green/Red/Grey/other)"
    node_id: request_manual_data_gate
    phase: "Manual data"
    estimated_turns: {low: 1, high: 1}

  - description: "Ask duty manager for sorter metrics (volume + fail rate per site)"
    phase: "Manual data"
    estimated_turns: {low: 1, high: 1}

  - description: "Ask duty manager for BI dashboard dwell data (brand/carrier/site/packages)"
    phase: "Manual data"
    estimated_turns: {low: 1, high: 1}

  - description: "Apply thresholds to manual data — appointment non-compliant flag, sorter flags, dwell color-coding"
    phase: "Manual data"
    estimated_turns: {low: 1, high: 2}

  - description: "Compose KPI header and Section 1 (Dock Compliance)"
    node_id: render_report
    phase: "Report format"
    estimated_turns: {low: 2, high: 3}

  - description: "Compose Section 2 (Missort & Loss)"
    phase: "Report format"
    estimated_turns: {low: 2, high: 3}

  - description: "Compose Section 3 (Dwell) and finalize report with artifact reminder"
    phase: "Report format"
    estimated_turns: {low: 2, high: 3}

totals:
  low: 12
  high: 22

notes: >-
  This skill is a structured daily report with no per-item loops; all steps
  are sequential (or batched parallel). The biggest variance is in how many
  tool calls the agent batches in a single turn (all four data pulls could be
  1-2 turns if the agent calls them concurrently, or up to 8 turns if
  strictly sequential). The HITL wait for manual data is not counted in turns
  (it is human think-time). Report assembly dominates: the agent must read
  seven data structures and produce a three-section Markdown document, which
  typically takes 3-5 passes to get the formatting right. Range: 12-22 turns
  for a competent run.
