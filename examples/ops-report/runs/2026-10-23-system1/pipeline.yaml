version: 0.1.0
description: Scheduled daily executive operations report for a parcel fulfillment
  network. Auto-pulls shipment-container and dock/dwell spreadsheets from Google Drive
  and dock-activity emails from Gmail, asks the duty manager for the handful of numbers
  that live behind interactive dashboards, then assembles a three-section executive
  summary with a KPI header and color-coded dwell alerts.
name: ops-report
source_skill: ../../skill
input:
  type: OpsReportInput
  input_schema:
    type: object
    properties:
      report_date:
        type: string
    required:
    - report_date
edges:
- from: shipment_containers_read
  to: shipment_containers_summary
- from: dock_pending_read
  to: dock_pending_summary
- from: dock_emails_search
  to: dock_email_summary
- from: open_dwell_read
  to: open_dwell_filter
- from: manual_data_gate
  to: manual_data_flags
- from: shipment_containers_summary
  to: executive_report
- from: dock_pending_summary
  to: executive_report
- from: dock_email_summary
  to: executive_report
- from: open_dwell_filter
  to: executive_report
- from: manual_data_flags
  to: executive_report
- from: shipment_containers_summary
  to: manual_data_gate
- from: dock_pending_summary
  to: manual_data_gate
- from: dock_email_summary
  to: manual_data_gate
- from: open_dwell_filter
  to: manual_data_gate
entry_nodes:
- shipment_containers_read
- dock_pending_read
- dock_emails_search
- open_dwell_read
exit_nodes:
- executive_report
nodes:
- description: Reads the shipment containers spreadsheet from Google Drive and returns
    its first tab (the facility summary table with a COMPLETION % column) as CSV text.
  output: dict
  output_schema:
    type: string
    description: CSV text of the sheet, inferred from the tool returning file content
      as text
  input_schema:
    type: object
    properties:
      request:
        type: object
        properties: &id001
          report_date:
            type: string
        required: &id002
        - report_date
  id: shipment_containers_read
  kind: external_call
  inputs:
    request: pipeline.input
  mandatory: true
  constants:
    shipment_containers_file_id: 1ExampleShipmentContainersFileId00000000000
  impl: extracted/shipment_containers_read.py:shipment_containers_read
  mcp:
    server: google_drive
    tool: read_file_content
    args:
      file_id: shipment_containers_file_id
  retry:
    max: 3
    backoff: exponential
  source:
    section: 'Data sources to auto-pull:'
- description: Parses the shipment container facility summary into per-site active,
    loaded, staged, shipped counts and completion %, and flags sites below the completion
    threshold.
  output:
    site_container_flow: list
    low_completion_sites: list
  output_schema:
    type: object
    properties: &id003
      site_container_flow:
        type: array
        items:
          type: object
          properties:
            site:
              type: string
              description: Site name
            active:
              type: integer
              description: Active container count
            loaded:
              type: integer
              description: Loaded container count
            staged:
              type: integer
              description: Staged container count
            shipped:
              type: integer
              description: Shipped container count
            completion_pct:
              type: number
              description: Completion percent for the site
            below_threshold:
              type: boolean
              description: True when completion is below the flag threshold
            wow_trend:
              type:
              - number
              - 'null'
              description: Week-over-week completion change, if available
          required:
          - site
          - active
          - loaded
          - staged
          - shipped
          - completion_pct
          - below_threshold
        description: Container flow rows, one per site
      low_completion_sites:
        type: array
        items:
          type: object
          properties:
            site:
              type: string
              description: Flagged site name
            completion_pct:
              type: number
              description: Completion percent of flagged site
          required:
          - site
          - completion_pct
        description: Sites with completion below 75%
      average_completion_pct:
        type:
        - number
        - 'null'
        description: Average completion % across sites for the KPI header; null if
          no sites
      active_site_count:
        type: integer
        description: Number of sites in the table, for the Active sites KPI
    required: &id004
    - site_container_flow
    - low_completion_sites
    - average_completion_pct
    - active_site_count
  input_schema:
    type: object
    properties:
      request:
        type: object
        properties: *id001
        required: *id002
      shipment_containers_read: {}
  id: shipment_containers_summary
  kind: pure_function
  inputs:
    request: pipeline.input
    shipment_containers_read: shipment_containers_read.output
  mandatory: true
  constants:
    completion_flag_threshold: 75%
  impl: extracted/shipment_containers_summary.py:shipment_containers_summary
  source:
    section: 'Data sources to auto-pull:'
- description: Reads the Dock Pending Log spreadsheet from Google Drive and returns
    its content as CSV text.
  output: dict
  output_schema:
    type: string
    description: 'CSV text of the dock pending log''s first tab, with a header row
      including Resolved, site and issue type columns (inferred: the tool returns
      spreadsheet content as text)'
  input_schema:
    type: object
    properties:
      request:
        type: object
        properties: *id001
        required: *id002
  id: dock_pending_read
  kind: external_call
  inputs:
    request: pipeline.input
  mandatory: true
  constants:
    dock_pending_file_id: 1ExampleDockPendingLogFileId0000000000000000
  impl: extracted/dock_pending_read.py:dock_pending_read
  mcp:
    server: google_drive
    tool: read_file_content
    args:
      file_id: dock_pending_file_id
  retry:
    max: 3
    backoff: exponential
  source:
    section: 'Data sources to auto-pull:'
- description: Counts the open dock pending log rows where Resolved = FALSE, in total,
    by site and by issue type.
  output:
    dock_pending_total: int
    dock_pending_by_site: dict
    dock_pending_by_issue_type: dict
  output_schema:
    type: object
    properties: &id005
      dock_pending_total:
        type: integer
        description: Total open rows where Resolved = FALSE
      dock_pending_by_site:
        type: object
        properties: {}
        description: Open count keyed by site (EAST1, WEST2, etc.)
      dock_pending_by_issue_type:
        type: object
        properties: {}
        description: Open count keyed by issue type (PO Number, Pallet/Piece Count
          Discrepancy)
    required: &id006
    - dock_pending_total
    - dock_pending_by_site
    - dock_pending_by_issue_type
  input_schema:
    type: object
    properties:
      request:
        type: object
        properties: *id001
        required: *id002
      dock_pending_read: {}
  id: dock_pending_summary
  kind: pure_function
  inputs:
    request: pipeline.input
    dock_pending_read: dock_pending_read.output
  mandatory: true
  impl: extracted/dock_pending_summary.py:dock_pending_summary
  source:
    section: 'Data sources to auto-pull:'
- description: Searches Gmail for dock-activity threads from the last day and returns
    the matching threads as an array.
  output: dict
  output_schema:
    type: array
    items:
      type: object
      properties:
        id:
          type: string
          description: Thread id
        subject:
          type: string
          description: Thread subject
        sender:
          type: string
          description: Sender of the thread
        date:
          type: string
          description: Date of the thread
        snippet:
          type: string
          description: Snippet of the latest message
      required:
      - id
      - subject
      - sender
      - date
      - snippet
    description: Matching Gmail threads, newest first (inferred from tool description)
  input_schema:
    type: object
    properties:
      request:
        type: object
        properties: *id001
        required: *id002
  id: dock_emails_search
  kind: external_call
  inputs:
    request: pipeline.input
  mandatory: true
  constants:
    dock_email_query: label:dock-activity newer_than:1d
  impl: extracted/dock_emails_search.py:dock_emails_search
  mcp:
    server: gmail
    tool: search_threads
    args:
      query: dock_email_query
  retry:
    max: 3
    backoff: exponential
  source:
    section: 'Data sources to auto-pull:'
- description: Counts Approved versus Requested dock appointments from the dock-activity
    email threads and lists the outstanding requests not yet approved.
  output:
    approved_count: int
    requested_count: int
    outstanding_requests: list
  output_schema:
    type: object
    properties: &id007
      approved_count:
        type: integer
        description: Number of Approved appointments
      requested_count:
        type: integer
        description: Number of Requested appointments
      outstanding_requests:
        type: array
        items:
          type: object
          properties:
            thread_id:
              type:
              - string
              - 'null'
              description: Gmail thread id
            subject:
              type: string
              description: Email subject of the request
            sender:
              type:
              - string
              - 'null'
              description: Email sender
            date:
              type:
              - string
              - 'null'
              description: Email date
            snippet:
              type:
              - string
              - 'null'
              description: Snippet of latest message
          required:
          - subject
        description: Requests not yet approved
      outstanding_count:
        type: integer
        description: Number of outstanding requests
    required: &id008
    - approved_count
    - requested_count
    - outstanding_requests
    - outstanding_count
  input_schema:
    type: object
    properties:
      request:
        type: object
        properties: *id001
        required: *id002
      dock_emails_search: {}
  id: dock_email_summary
  kind: pure_function
  inputs:
    request: pipeline.input
    dock_emails_search: dock_emails_search.output
  mandatory: true
  impl: extracted/dock_email_summary.py:dock_email_summary
  source:
    section: 'Data sources to auto-pull:'
- description: Reads the dwell ticket log tab "Dwell Log - Form Responses" from Google
    Drive and returns its content as CSV text.
  output: dict
  output_schema:
    type: string
    description: CSV text of the Dwell Log tab, header row first, including the Open/Closed
      column
  input_schema:
    type: object
    properties:
      request:
        type: object
        properties: *id001
        required: *id002
  id: open_dwell_read
  kind: external_call
  inputs:
    request: pipeline.input
  mandatory: true
  constants:
    dwell_ticket_file_id: 1ExampleDwellTicketLogFileId0000000000000000
    dwell_ticket_tab: Dwell Log - Form Responses
  impl: extracted/open_dwell_read.py:open_dwell_read
  mcp:
    server: google_drive
    tool: read_file_content
    args:
      file_id: dwell_ticket_file_id
      tab: dwell_ticket_tab
  retry:
    max: 3
    backoff: exponential
  source:
    section: 'Data sources to auto-pull:'
- description: Filters the dwell ticket log to rows whose Open/Closed column is "Open",
    reports each ticket's details, and flags missort and misload thresholds.
  output:
    open_dwell_tickets: list
    open_ticket_count: int
    dwell_ticket_flags: list
  output_schema:
    type: object
    properties: &id009
      open_dwell_tickets:
        type: array
        items:
          type: object
          properties:
            date:
              type:
              - string
              - 'null'
              description: Ticket date
            facility:
              type:
              - string
              - 'null'
              description: Facility of the ticket
            packages:
              type:
              - integer
              - 'null'
              description: Number of packages
            client_impact:
              type:
              - string
              - 'null'
              description: Client impact text
            carrier_impact:
              type:
              - string
              - 'null'
              description: Carrier impact text
            issue_description:
              type:
              - string
              - 'null'
              description: Issue description
          required:
          - date
          - facility
          - packages
          - client_impact
          - carrier_impact
          - issue_description
        description: Open dwell tickets, one per open row
      open_ticket_count:
        type: integer
        description: Number of open dwell tickets
      dwell_ticket_flags:
        type: array
        items:
          type: object
          properties:
            date:
              type:
              - string
              - 'null'
              description: Date of the flagged ticket
            facility:
              type:
              - string
              - 'null'
              description: Facility of the flagged ticket
            flag:
              type: string
              enum:
              - Missort Warning
              - Missort Alert
              - Possible Misload Alert
              description: Flag name raised
            value:
              type: integer
              description: Package or carrier count that triggered the flag
          required:
          - facility
          - flag
          - value
        description: Threshold flags raised on open tickets
    required: &id010
    - open_dwell_tickets
    - open_ticket_count
    - dwell_ticket_flags
  input_schema:
    type: object
    properties:
      request:
        type: object
        properties: *id001
        required: *id002
      open_dwell_read: {}
  id: open_dwell_filter
  kind: pure_function
  inputs:
    request: pipeline.input
    open_dwell_read: open_dwell_read.output
  mandatory: true
  constants:
    missort_warning_packages: 25
    missort_alert_packages: 41
    possible_misload_carrier: 80
  impl: extracted/open_dwell_filter.py:open_dwell_filter
  source:
    section: 'Data sources to auto-pull:'
- description: 'Manual data to request from user:: Pause until the duty manager supplies
    the dock appointment, sorter, and current dwell numbers that live behind dashboards.'
  output:
    dock_appointment_completion: dict
    sorter_metrics: list
    current_dwell: list
  output_schema:
    type: object
    properties:
      current_dwell:
        type: array
        items:
          type: object
          properties:
            carrier:
              type: string
            packages:
              type: integer
            shipper:
              type: string
            site:
              type: string
          required:
          - carrier
          - packages
          - shipper
          - site
      dock_appointment_completion:
        type: object
        properties:
          green:
            type: integer
          grey:
            type: integer
          other:
            type: integer
          red:
            type: integer
        required:
        - green
        - grey
        - other
        - red
      sorter_metrics:
        type: array
        items:
          type: object
          properties:
            fail_rate_pct:
              type: number
            prior_day_volume:
              type: integer
            site:
              type: string
            volume:
              type: integer
          required:
          - fail_rate_pct
          - prior_day_volume
          - site
          - volume
    required:
    - current_dwell
    - dock_appointment_completion
    - sorter_metrics
  input_schema:
    type: object
    properties:
      request:
        type: object
        properties: *id001
        required: *id002
  id: manual_data_gate
  kind: hitl_gate
  inputs:
    request: pipeline.input
  signal: manual_data
  source:
    section: 'Manual data to request from user:'
- description: Applies the skill's manual-data rules to the duty manager's inputs,
    giving appointment escalations, sorter flags and current dwell alerts.
  output:
    appointment_escalations: list
    sorter_flags: list
    current_dwell_alerts: list
  output_schema:
    type: object
    properties: &id011
      appointment_completion:
        type: object
        properties:
          green:
            type: integer
            description: Green (Complete) count
          red:
            type: integer
            description: Red (No Call/No Show) count
          grey:
            type: integer
            description: Grey (Canceled) count
          non_compliant:
            type: integer
            description: Other color (Non-Compliant) count
        description: Dock appointment counts by color
        required:
        - green
        - red
        - grey
        - non_compliant
      appointment_escalations:
        type: array
        items:
          type: object
          properties:
            category:
              type: string
              enum:
              - Non-Compliant
              description: Escalation category
            count:
              type: integer
              description: Number of Non-Compliant appointments
            escalate:
              type: boolean
              description: Whether escalation is required
          required:
          - category
          - count
          - escalate
        description: Non-Compliant appointments that must be escalated
      sorter_flags:
        type: array
        items:
          type: object
          properties:
            site:
              type: string
              description: Site name
            volume:
              type: number
              description: Volume output
            prior_day_volume:
              type: number
              description: Prior day volume
            fail_rate_pct:
              type: number
              description: Fail rate percent
            volume_change_pct:
              type: number
              description: Day-over-day volume change percent
            fail_rate_flag:
              type: boolean
              description: Fail rate above 5% (action needed)
            volume_drop_flag:
              type: boolean
              description: Volume dropped over 15% (divert adjustment may be needed)
            flags:
              type: array
              items:
                type: string
              description: Human-readable flag messages
          required:
          - site
          - volume
          - prior_day_volume
          - fail_rate_pct
          - volume_change_pct
          - fail_rate_flag
          - volume_drop_flag
          - flags
        description: Per-site sorter metrics with flags raised
      current_dwell_alerts:
        type: array
        items:
          type: object
          properties:
            shipper:
              type: string
              description: Shipper/brand name
            carrier:
              type: string
              description: Carrier
            site:
              type: string
              description: Site
            packages:
              type: integer
              description: Orders/packages dwelling
            brand_alert:
              type:
              - string
              - 'null'
              enum:
              - Missort Warning
              - Missort Alert
              description: Brand alert level, null if none
            brand_color:
              type:
              - string
              - 'null'
              enum:
              - light red
              - bright red
              description: Brand alert color, null if none
            carrier_alert:
              type:
              - string
              - 'null'
              enum:
              - Possible Misload Alert
              description: Carrier alert, null if none
            carrier_color:
              type:
              - string
              - 'null'
              enum:
              - darkest red
              description: Carrier alert color, null if none
          required:
          - shipper
          - carrier
          - site
          - packages
        description: Current dwell entries with alert level
    required: &id012
    - appointment_completion
    - appointment_escalations
    - sorter_flags
    - current_dwell_alerts
  input_schema:
    type: object
    properties:
      request:
        type: object
        properties: *id001
        required: *id002
      manual_data_gate:
        type: object
        properties:
          current_dwell:
            type: array
            items:
              type: object
              properties:
                carrier:
                  type: string
                packages:
                  type: integer
                shipper:
                  type: string
                site:
                  type: string
              required:
              - carrier
              - packages
              - shipper
              - site
          dock_appointment_completion:
            type: object
            properties:
              green:
                type: integer
              grey:
                type: integer
              other:
                type: integer
              red:
                type: integer
            required:
            - green
            - grey
            - other
            - red
          sorter_metrics:
            type: array
            items:
              type: object
              properties:
                fail_rate_pct:
                  type: number
                prior_day_volume:
                  type: integer
                site:
                  type: string
                volume:
                  type: integer
              required:
              - fail_rate_pct
              - prior_day_volume
              - site
              - volume
        required:
        - current_dwell
        - dock_appointment_completion
        - sorter_metrics
  id: manual_data_flags
  kind: pure_function
  inputs:
    request: pipeline.input
    manual_data_gate: manual_data_gate.output
  mandatory: true
  constants:
    sorter_fail_rate_threshold: 5%
    sorter_volume_drop_threshold: 15%
    brand_warning_range: 25-40
    brand_alert_threshold: 41+
    carrier_misload_threshold: 80+
  impl: extracted/manual_data_flags.py:manual_data_flags
  source:
    section: 'Manual data to request from user:'
- description: Assembles the executive operations report with a KPI header, three
    sections, and a reminder to open the live "ops-report" artifact.
  output:
    executive_report: dict
  output_schema:
    type: object
    properties:
      executive_report:
        type: object
        properties:
          report_date:
            type: string
            description: Report date
          kpi_header:
            type: object
            properties:
              active_sites:
                type: integer
                description: Count of active sites
              dock_pending_count:
                type: integer
                description: Total open dock pending rows
              avg_completion_pct:
                type:
                - number
                - 'null'
                description: Average completion % across sites, null if none
              open_dwell_tickets:
                type: integer
                description: Count of open dwell tickets
            description: KPI header values
            required:
            - active_sites
            - dock_pending_count
            - avg_completion_pct
            - open_dwell_tickets
          section_1_dock_compliance:
            type: object
            properties:
              appointment_tiles:
                type: object
                properties: {}
                description: Dock appointment completion counts from manual data
              gmail_summary:
                type: object
                properties: {}
                description: Dock email summary as produced upstream
              pending_log_table:
                type: object
                properties: {}
                description: Dock pending summary as produced upstream
            description: 'Section 1: appointment tiles, Gmail summary, pending log
              table'
            required:
            - appointment_tiles
            - gmail_summary
            - pending_log_table
          section_2_missort_loss:
            type: object
            properties:
              sorter_metrics:
                type: array
                items:
                  type: object
                  properties: {}
                description: Sorter metrics with flags per site
              container_flow_table:
                type: array
                items:
                  type: object
                  properties: {}
                description: Container flow rows by site with completion %
            description: 'Section 2: sorter metrics and container flow'
            required:
            - sorter_metrics
            - container_flow_table
          section_3_dwell:
            type: object
            properties:
              dwell_alerts:
                type: array
                items:
                  type: object
                  properties: {}
                description: Color-coded BI dashboard dwell alerts
              open_dwell_impact_log:
                type: array
                items:
                  type: object
                  properties: {}
                description: Open dwell tickets with flags
            description: 'Section 3: dwell alerts and open tickets'
            required:
            - dwell_alerts
            - open_dwell_impact_log
          artifact_reminder:
            type: string
            description: Reminder to open the live ops-report artifact for charts
        description: The assembled executive report
        required:
        - report_date
        - kpi_header
        - section_1_dock_compliance
        - section_2_missort_loss
        - section_3_dwell
        - artifact_reminder
    required:
    - executive_report
  input_schema:
    type: object
    properties:
      request:
        type: object
        properties: *id001
        required: *id002
      shipment_containers_summary:
        type: object
        properties: *id003
        required: *id004
      dock_pending_summary:
        type: object
        properties: *id005
        required: *id006
      dock_email_summary:
        type: object
        properties: *id007
        required: *id008
      open_dwell_filter:
        type: object
        properties: *id009
        required: *id010
      manual_data_flags:
        type: object
        properties: *id011
        required: *id012
  id: executive_report
  kind: pure_function
  inputs:
    request: pipeline.input
    shipment_containers_summary: shipment_containers_summary.output
    dock_pending_summary: dock_pending_summary.output
    dock_email_summary: dock_email_summary.output
    open_dwell_filter: open_dwell_filter.output
    manual_data_flags: manual_data_flags.output
  mandatory: true
  impl: extracted/executive_report.py:executive_report
  source:
    section: 'Report format:'
