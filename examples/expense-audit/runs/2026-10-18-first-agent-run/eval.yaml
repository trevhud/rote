version: 1
source_skill: ../../skill
steps:
  - description: "Convert every expense line to USD using the period's month-end rates"
    node_id: convert_to_usd
    phase: "1"
    estimated_turns: {low: 1, high: 3}
    estimated_tool_calls: {low: 1, high: 3}
    # An agent reads fx-rates.md (1 turn), then applies the conversion. With a
    # large batch it may need multiple turns to work through all lines; small
    # batches converge in 1. The overhead of re-reading the reference file is
    # the dominant variable.

  - description: "Check all lines for duplicate submissions (same employee, merchant, amount, currency, date)"
    node_id: check_duplicates
    phase: "2"
    estimated_turns: {low: 1, high: 2}
    estimated_tool_calls: {low: 1, high: 2}
    # Purely algorithmic — an agent can apply the rule in one pass, but may
    # take a second turn to confirm its groupings on larger batches.

  - description: "Check all lines for late submissions (60-day policy window)"
    node_id: check_late_submissions
    phase: "3"
    estimated_turns: {low: 1, high: 2}
    estimated_tool_calls: {low: 1, high: 2}
    # Date arithmetic with a fixed threshold. One pass is typical; a second
    # turn covers boundary cases (last day of month arithmetic).

  - description: "Audit each employee's report against all policy rules"
    node_id: apply_policy_rules
    phase: "4"
    estimated_turns: {low: 2, high: 4}
    iterations: {low: 3, high: 20}
    # An agent processes one or a few employees per turn. With 3-20 employees,
    # the per-employee loop is the dominant cost. 2-4 turns covers reading
    # expense-policy.md plus applying all rules; the upper end covers cases
    # where the agent re-reads the policy mid-audit or corrects mis-flagged
    # lines on a second pass.

  - description: "Summarize batch and build sorted review queue"
    node_id: build_review_queue
    phase: "5"
    estimated_turns: {low: 1, high: 2}
    estimated_tool_calls: {low: 1, high: 2}
    # Fixed aggregation and sorting — converges in one turn with occasional
    # second-turn corrections if the agent's sort was wrong.

  - description: "Post review queue to controller and wait for decisions (HITL)"
    node_id: controller_review_gate
    phase: "6"
    estimated_turns: {low: 1, high: 2}
    # In an agent loop the agent presents the queue in one turn; the human
    # responds externally. Only the presentation turn is counted here.

  - description: "Render the final audit report in the fixed markdown layout"
    node_id: render_audit_report
    phase: "7"
    estimated_turns: {low: 2, high: 5}
    estimated_tool_calls: {low: 1, high: 3}
    # An agent reads report-format.md (1 turn), then generates the markdown.
    # Reports with many employees or complex decision tables take more turns to
    # assemble the three tables (header, Employees, Review queue) correctly.

  - description: "Save the audit report to the finance shared folder"
    node_id: save_audit_report
    phase: "7"
    estimated_turns: {low: 1, high: 1}
    estimated_tool_calls: {low: 1, high: 1}
    # Fixed write tool call — always 1 turn.

totals:
  # Base overhead (steps 1-3 in parallel, steps 5-7): ~7-15 turns.
  # Per-employee loop (step 4): 3-20 employees × 2-4 turns = 6-80 turns.
  # Realistic batch with 5-10 employees: ~20-40 turns total.
  low: 13
  high: 95
notes: >-
  The per-employee audit loop in Step 4 dominates. A small batch (3-5
  employees, no unusual findings) lands around 15-25 turns; a large batch
  (15-20 employees, several policy violations) can reach 70-95 turns as the
  agent re-reads the policy file to verify edge cases. Steps 1-3 run
  sequentially in an agent (they share context) — the 3-parallel Wave 1
  speedup only appears in the compiled pipeline.
