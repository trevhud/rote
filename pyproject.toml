[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# Distribution name is `rote-cli` because `rote` is taken on PyPI
# (an unrelated memoization library, active as of 2026-05). The
# import name and CLI command remain `rote`. See docs/releasing.md.
name = "rote-cli"
dynamic = ["version"]
description = "Graduate fuzzy AI skills into deterministic, reliable workflows"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Trevor Hudson" }]
keywords = [
    "ai",
    "llm",
    "agent",
    "skill",
    "workflow",
    "temporal",
    "cloudflare",
    "claude",
    "anthropic",
    "dspy",
    "graduation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
temporal = [
    "temporalio>=1.7",
]
api = [
    "anthropic>=0.89",
]
dbos = [
    "dbos>=2.26",
]
serve = [
    "fastmcp>=3.4.2",
    "httpx>=0.28",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml",
    "temporalio>=1.7",
    "anthropic>=0.89",
    "dbos>=2.26",
    "fastmcp>=3.4.2",
    "httpx>=0.28",
]

[project.scripts]
rote = "rote.cli:main"

[project.urls]
Homepage = "https://github.com/trevhud/rote"
Repository = "https://github.com/trevhud/rote"
Issues = "https://github.com/trevhud/rote/issues"
Documentation = "https://github.com/trevhud/rote#readme"

[tool.hatch.version]
path = "src/rote/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rote"]

# The graduator agent's skill bundle lives at the repo root (it is the
# product's Layer 1 and is consumed in-place during development), so it
# is force-included into the wheel at rote/skills/rote-graduate.
# `_default_graduator_skill_dir()` in src/rote/graduator/__init__.py
# checks that packaged location first, then the repo-root layout for
# editable installs. If you move or rename the bundle, update both.
[tool.hatch.build.targets.wheel.force-include]
"skills/rote-graduate" = "rote/skills/rote-graduate"

[tool.hatch.build.targets.sdist]
# Keep the sdist lean but self-sufficient: building a wheel from the
# sdist needs src/ and the skill bundle at the same relative paths.
include = [
    "src/rote",
    "skills/rote-graduate",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# examples/ holds machine-emitted snapshots (adapter output, graduator
# runs) kept verbatim as regression baselines — hand-linting them would
# diverge them from what the tools actually produce.
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: tests that need an external toolchain (Node/npm/tsc) or take >5s. Run with `pytest -m slow` to include.",
]

[tool.mypy]
python_version = "3.11"
strict = true
