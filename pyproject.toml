[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# Distribution name is `rote-cli` because `rote` is taken on PyPI
# (an unrelated memoization library, active as of 2026-05). The
# import name and CLI command remain `rote`. See docs/releasing.md.
name = "rote-cli"
dynamic = ["version"]
description = "Compile AI agent skills into cheap, fast, deterministic pipelines that run without an LLM in the loop"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Trevor Hudson", email = "trevhud@gmail.com" }]
keywords = [
    "ai",
    "llm",
    "agent",
    "skill",
    "workflow",
    "temporal",
    "cloudflare",
    "claude",
    "anthropic",
    "dspy",
    "compilation",
    "compiler",
    "agent-skills",
    "claude-skills",
    "claude-code",
    "deterministic",
    "durable-execution",
    "mcp",
    "token-cost",
    "agent-workflow",
    "dbos",
    "inngest",
    "pipeline",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # rote compile runs the tests its agent writes, in a sandbox, and feeds
    # failures back for repair. Without pytest that silently did nothing for
    # every user who installed rote-cli without the dev extra.
    "pytest>=9.0,<10",
    # --backend api checks a GraphQL request against the vendor's schema
    # (rote.vendor_specs.graphql). Pure Python.
    "graphql-core>=3.3,<4",
    # Onboarding prompts (rote.interact.prompter): checkboxes and selects,
    # drawn on stderr, testable through prompt_toolkit's pipe input.
    "questionary>=2.1.1,<3",
    # Styled stderr output for onboarding (rote.interact.output).
    "rich>=15.0.0,<16",
    # Reading other AI clients' JSONC configs (rote.clients: Zed, VS Code,
    # OpenCode, Cursor...), which allow comments and trailing commas.
    # Pure Python, typed.
    "json5>=0.17.3,<1",
    # The MCP client: every MCP-bound step, `rote mcp login`, compile's tool
    # grounding. The slim distribution's client half is what rote needs on
    # every install; the server half (uvicorn, cyclopts, joserfc...) is only
    # for `rote serve` and the bench's fixture servers, the serve extra.
    # rote.mcp._runtime_helper.FASTMCP_REQUIREMENT is this same string
    # (tested). fastmcp-slim speaks HTTP through httpx2; rote's own HTTP
    # calls (run releases, pending logins) use httpx.
    "fastmcp-slim[client]>=4.1.3,<5",
    "httpx>=0.28",
]

[project.optional-dependencies]
temporal = [
    "temporalio>=1.7",
]
api = [
    "anthropic>=1.15",
]
openai-api = [
    "openai>=2.45",
]
# The workflow runtimes rote runs in its own environment are extras: a
# user who picks temporal should not download dbos, and the other way
# round. Running an app whose extra is missing (`rote run` on a dbos app)
# offers to install it, as a plan the user confirms
# (rote.setup.install_extra); compile, emit and init only print the hint.
dbos = [
    "dbos>=3.3,<4",
]
# `rote serve` and the bench's fixture MCP servers: fastmcp's server half.
# The full distribution is fastmcp-slim[client,server] at the same version,
# so its range is the base one (tested).
serve = [
    "fastmcp>=4.1.3,<5",
]
# The MCP client is a base dependency now. The extra stays, empty, so an
# install command written for an older release (`rote-cli[mcp]`) still
# resolves. rote.extras.ALIAS_EXTRAS lists it (tested).
mcp = []
dev = [
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml",
    "temporalio>=1.7",
    "anthropic>=1.15",
    "openai>=2.45",
    "dbos>=3.3,<4",
    "fastmcp>=4.1.3,<5",
    "trustme>=1.2.1",
    "requests>=2.34.2",
    "httplib2>=0.32.0",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "google-auth-httplib2>=0.4.4",
]

[project.scripts]
rote = "rote.entry:main"
# `uvx rote-cli ...` runs the command named after the distribution, so the
# distribution name is also a command. Both run the same entry point.
rote-cli = "rote.entry:main"

[project.urls]
Homepage = "https://roteskills.com"
Repository = "https://github.com/trevhud/rote"
Documentation = "https://github.com/trevhud/rote#readme"
Changelog = "https://github.com/trevhud/rote/blob/main/CHANGELOG.md"
Issues = "https://github.com/trevhud/rote/issues"

[tool.hatch.version]
path = "src/rote/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rote"]

# The compiler agent's skill bundle lives at the repo root (it is the
# product's Layer 1 and is consumed in-place during development), so it
# is force-included into the wheel at rote/skills/rote-compile.
# `_default_compiler_skill_dir()` in src/rote/compiler/__init__.py
# checks that packaged location first, then the repo-root layout for
# editable installs. If you move or rename the bundle, update both.
[tool.hatch.build.targets.wheel.force-include]
"skills/rote-compile" = "rote/skills/rote-compile"
# `rote example` ships the examples that run with no credentials. The
# files live only in examples/; these paths must match
# `rote.examples.BUNDLED[...].files` (tests/test_examples_command.py
# pins it), and `examples_root()` falls back to the repo layout for
# editable installs, like the skill bundle above.
"examples/expense-audit/README.md" = "rote/examples/expense-audit/README.md"
"examples/expense-audit/input.json" = "rote/examples/expense-audit/input.json"
"examples/expense-audit/eval-input.json" = "rote/examples/expense-audit/eval-input.json"
"examples/expense-audit/skill" = "rote/examples/expense-audit/skill"
"examples/expense-audit/expected/pipeline.yaml" = "rote/examples/expense-audit/expected/pipeline.yaml"
"examples/expense-audit/expected/pipeline-draft.yaml" = "rote/examples/expense-audit/expected/pipeline-draft.yaml"
"examples/expense-audit/expected/eval.yaml" = "rote/examples/expense-audit/expected/eval.yaml"
"examples/expense-audit/expected/extracted" = "rote/examples/expense-audit/expected/extracted"
"examples/expense-audit/scorecard.md" = "rote/examples/expense-audit/scorecard.md"
"examples/expense-audit/runs" = "rote/examples/expense-audit/runs"
# The first-run demo (`rote.demo`), also `rote example docs-digest`.
"examples/docs-digest/README.md" = "rote/examples/docs-digest/README.md"
"examples/docs-digest/skill" = "rote/examples/docs-digest/skill"
"examples/docs-digest/compiled" = "rote/examples/docs-digest/compiled"
"examples/docs-digest/reference.json" = "rote/examples/docs-digest/reference.json"

[tool.hatch.build.targets.sdist]
# Keep the sdist lean but self-sufficient: building a wheel from the
# sdist needs src/ and the skill bundle at the same relative paths.
include = [
    "src/rote",
    "skills/rote-compile",
    "examples/expense-audit",
    "examples/docs-digest",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# examples/ holds machine-emitted snapshots (adapter output, compiler
# runs) kept verbatim as regression baselines — hand-linting them would
# diverge them from what the tools actually produce.
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
# -rs: always print the REASON for every skip. A conditional skip whose
# condition silently becomes permanent is invisible behind a bare
# "1 skipped" count — that is how `test_per_tool_override_changes_payload`
# went from a real test to dead weight without anyone noticing.
addopts = "-m 'not slow' -rs"
markers = [
    "slow: tests that need an external toolchain (Node/npm/tsc) or take >5s. Run with `pytest -m slow` to include.",
]

[tool.mypy]
python_version = "3.11"
strict = true
